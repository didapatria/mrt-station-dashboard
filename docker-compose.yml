services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mrt-postgres
    environment:
      POSTGRES_DB: mrt_station_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    container_name: mrt-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mrt_station_db?schema=public
      JWT_SECRET: mrt-jakarta-super-secret-key-2024
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend
  frontend:
    build: ./frontend
    container_name: mrt-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
