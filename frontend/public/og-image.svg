<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#0b1525"/>
    </linearGradient>
    <linearGradient id="accentH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d6fe8"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d6fe8"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardTopFade" x1="0" y1="0" x2="0" y2="1"
      gradientUnits="userSpaceOnUse" gradientTransform="translate(0,80) scale(1,80)">
      <stop offset="0%" stop-color="#1d6fe8" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#1d6fe8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#1d6fe8" stroke-opacity="0.048" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Ambient glow -->
  <circle cx="180" cy="200" r="300" fill="#1d6fe8" opacity="0.07" filter="url(#blur)"/>
  <circle cx="1020" cy="440" r="240" fill="#3b82f6" opacity="0.05" filter="url(#blur)"/>

  <!-- Top + bottom accent bars -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentH)"/>
  <rect x="0" y="627" width="1200" height="3" fill="url(#accentH)"/>

  <!-- Left accent line (right edge x=66 = card left edge) -->
  <rect x="63" y="80" width="3" height="470" fill="url(#accentV)"/>

  <!-- Card -->
  <rect x="66" y="80" width="1054" height="470" rx="8" fill="#0d1829" fill-opacity="0.88"/>
  <rect x="66" y="80" width="1054" height="470" rx="8" fill="none"
    stroke="#1d6fe8" stroke-opacity="0.11" stroke-width="1"/>
  <rect x="66" y="80" width="1054" height="3" rx="1" fill="url(#accentH)"/>
  <rect x="66" y="80" width="1054" height="80" fill="url(#cardTopFade)"/>

  <!-- Train icon (content left x=140) -->
  <g transform="translate(140, 152)">
    <rect x="0" y="10" width="60" height="40" rx="6" fill="#1d6fe8" opacity="0.9"/>
    <rect x="4" y="14" width="52" height="22" rx="3" fill="#0a1428"/>
    <circle cx="12" cy="58" r="6" fill="#1d6fe8" opacity="0.88"/>
    <circle cx="48" cy="58" r="6" fill="#1d6fe8" opacity="0.88"/>
    <rect x="0" y="50" width="60" height="5" rx="2" fill="#1d6fe8" opacity="0.45"/>
    <rect x="8" y="17" width="14" height="13" rx="2" fill="#1d6fe8" opacity="0.7"/>
    <rect x="26" y="17" width="14" height="13" rx="2" fill="#1d6fe8" opacity="0.7"/>
    <rect x="42" y="17" width="10" height="13" rx="2" fill="#1d6fe8" opacity="0.38"/>
  </g>

  <!-- Titles -->
  <text x="216" y="212"
    font-family="Arial Black, sans-serif" font-size="68" font-weight="900"
    fill="white" letter-spacing="2">MRT JAKARTA</text>
  <text x="216" y="278"
    font-family="Arial Black, sans-serif" font-size="68" font-weight="900"
    fill="#1d6fe8" letter-spacing="2">DASHBOARD</text>

  <!-- Subtitle -->
  <text x="218" y="323"
    font-family="Courier New, monospace" font-size="16" fill="#4a5e7a" letter-spacing="3.5">STATION MANAGEMENT SYSTEM · OPERATIONS TERMINAL</text>

  <!-- Section divider -->
  <rect x="140" y="350" width="900" height="1" fill="url(#accentH)" opacity="0.5"/>

  <!-- Stats: numbers y=390  labels y=411
       Group positions (number/label left-aligned, dividers 14px after group right edge):
       G1 "14/PAGES"     x=140  divider x=198
       G2 "40+/FEATURES" x=212  divider x=294
       G3 "112/E2ETESTS" x=308  divider x=399
       G4 "230+/COMMITS" x=413
  -->
  <text x="140" y="390"
    font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="white">15</text>
  <text x="140" y="411"
    font-family="Courier New, monospace" font-size="10" fill="#475569" letter-spacing="2">PAGES</text>
  <rect x="198" y="370" width="1" height="52" fill="#1d6fe8" fill-opacity="0.25"/>

  <text x="212" y="390"
    font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="white">40+</text>
  <text x="212" y="411"
    font-family="Courier New, monospace" font-size="10" fill="#475569" letter-spacing="2">FEATURES</text>
  <rect x="294" y="370" width="1" height="52" fill="#1d6fe8" fill-opacity="0.25"/>

  <text x="308" y="390"
    font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="white">127</text>
  <text x="308" y="411"
    font-family="Courier New, monospace" font-size="10" fill="#475569" letter-spacing="2">E2E TESTS</text>
  <rect x="399" y="370" width="1" height="52" fill="#1d6fe8" fill-opacity="0.25"/>

  <text x="413" y="390"
    font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="white">290+</text>
  <text x="413" y="411"
    font-family="Courier New, monospace" font-size="10" fill="#475569" letter-spacing="2">COMMITS</text>

  <!-- Tech chips  y=447 h=26  text-anchor="middle" dominant-baseline="central"
       Widths = text_chars * 7.8px + 28px padding. Gap = 8px.
       "React 19"   90px  x=140  cx=185
       "TypeScript" 106px x=238  cx=291
       "PostgreSQL" 106px x=352  cx=405
       "Playwright" 106px x=466  cx=519
       "Docker"      75px x=580  cx=617
       "Prisma"      75px x=663  cx=700  -->
  <rect x="140" y="447" width="90" height="26" rx="4"
    fill="#1d6fe8" fill-opacity="0.09" stroke="#1d6fe8" stroke-opacity="0.22" stroke-width="1"/>
  <text x="185" y="460"
    font-family="Courier New, monospace" font-size="11" fill="#60a5fa"
    text-anchor="middle" dominant-baseline="central" letter-spacing="0.8">React 19</text>

  <rect x="238" y="447" width="106" height="26" rx="4"
    fill="#1d6fe8" fill-opacity="0.09" stroke="#1d6fe8" stroke-opacity="0.22" stroke-width="1"/>
  <text x="291" y="460"
    font-family="Courier New, monospace" font-size="11" fill="#60a5fa"
    text-anchor="middle" dominant-baseline="central" letter-spacing="0.8">TypeScript</text>

  <rect x="352" y="447" width="106" height="26" rx="4"
    fill="#1d6fe8" fill-opacity="0.09" stroke="#1d6fe8" stroke-opacity="0.22" stroke-width="1"/>
  <text x="405" y="460"
    font-family="Courier New, monospace" font-size="11" fill="#60a5fa"
    text-anchor="middle" dominant-baseline="central" letter-spacing="0.8">PostgreSQL</text>

  <rect x="466" y="447" width="106" height="26" rx="4"
    fill="#1d6fe8" fill-opacity="0.09" stroke="#1d6fe8" stroke-opacity="0.22" stroke-width="1"/>
  <text x="519" y="460"
    font-family="Courier New, monospace" font-size="11" fill="#60a5fa"
    text-anchor="middle" dominant-baseline="central" letter-spacing="0.8">Playwright</text>

  <rect x="580" y="447" width="75" height="26" rx="4"
    fill="#1d6fe8" fill-opacity="0.09" stroke="#1d6fe8" stroke-opacity="0.22" stroke-width="1"/>
  <text x="617" y="460"
    font-family="Courier New, monospace" font-size="11" fill="#60a5fa"
    text-anchor="middle" dominant-baseline="central" letter-spacing="0.8">Docker</text>

  <rect x="663" y="447" width="75" height="26" rx="4"
    fill="#1d6fe8" fill-opacity="0.09" stroke="#1d6fe8" stroke-opacity="0.22" stroke-width="1"/>
  <text x="700" y="460"
    font-family="Courier New, monospace" font-size="11" fill="#60a5fa"
    text-anchor="middle" dominant-baseline="central" letter-spacing="0.8">Prisma</text>

