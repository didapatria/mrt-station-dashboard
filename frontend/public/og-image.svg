<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070d1a"/>
      <stop offset="100%" style="stop-color:#0a1428"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1d6fe8"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d6fe8;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#1d6fe8" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glow blobs -->
  <circle cx="200" cy="200" r="300" fill="#1d6fe8" opacity="0.07" filter="url(#blur)"/>
  <circle cx="1000" cy="430" r="250" fill="#3b82f6" opacity="0.05" filter="url(#blur)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- Left border accent -->
  <rect x="60" y="80" width="3" height="470" fill="#1d6fe8" opacity="0.5"/>

  <!-- Card background -->
  <rect x="88" y="80" width="1024" height="470" rx="12" fill="#0d1829" opacity="0.8"/>
  <rect x="88" y="80" width="1024" height="470" rx="12" fill="none" stroke="#1d6fe8" stroke-opacity="0.15" stroke-width="1"/>
  <rect x="88" y="80" width="1024" height="3" rx="2" fill="url(#accent)"/>

  <!-- MRT Icon / Logo mark -->
  <g transform="translate(140, 160)">
    <!-- Train icon simplified -->
    <rect x="0" y="10" width="60" height="40" rx="6" fill="#1d6fe8" opacity="0.9"/>
    <rect x="4" y="14" width="52" height="22" rx="3" fill="#0a1428"/>
    <circle cx="12" cy="58" r="6" fill="#1d6fe8" opacity="0.9"/>
    <circle cx="48" cy="58" r="6" fill="#1d6fe8" opacity="0.9"/>
    <rect x="0" y="50" width="60" height="5" rx="2" fill="#1d6fe8" opacity="0.5"/>
    <!-- Windows -->
    <rect x="8" y="17" width="14" height="13" rx="2" fill="#1d6fe8" opacity="0.7"/>
    <rect x="26" y="17" width="14" height="13" rx="2" fill="#1d6fe8" opacity="0.7"/>
    <rect x="42" y="17" width="10" height="13" rx="2" fill="#1d6fe8" opacity="0.4"/>
  </g>

  <!-- Title -->
  <text x="230" y="215" font-family="Arial Black, sans-serif" font-size="68" font-weight="900" fill="white" letter-spacing="3">MRT JAKARTA</text>
  <text x="230" y="280" font-family="Arial Black, sans-serif" font-size="68" font-weight="900" fill="#1d6fe8" letter-spacing="3">DASHBOARD</text>

  <!-- Subtitle -->
  <text x="232" y="330" font-family="Courier New, monospace" font-size="18" fill="#94a3b8" letter-spacing="4">STATION MANAGEMENT SYSTEM · OPERATIONS TERMINAL</text>

  <!-- Divider -->
  <rect x="140" y="360" width="920" height="1" fill="#1d6fe8" opacity="0.3"/>

  <!-- Stats row -->
  <g font-family="Courier New, monospace" fill="#94a3b8">
    <!-- Stat 1 -->
    <text x="140" y="400" font-size="32" font-weight="700" fill="white">14</text>
    <text x="140" y="422" font-size="11" letter-spacing="2" fill="#64748b">PAGES</text>

    <!-- Divider -->
    <rect x="230" y="388" width="1" height="40" fill="#1d6fe8" opacity="0.3"/>

    <!-- Stat 2 -->
    <text x="248" y="400" font-size="32" font-weight="700" fill="white">40+</text>
    <text x="248" y="422" font-size="11" letter-spacing="2" fill="#64748b">FEATURES</text>

    <!-- Divider -->
    <rect x="358" y="388" width="1" height="40" fill="#1d6fe8" opacity="0.3"/>

    <!-- Stat 3 -->
    <text x="376" y="400" font-size="32" font-weight="700" fill="white">112</text>
    <text x="376" y="422" font-size="11" letter-spacing="2" fill="#64748b">E2E TESTS</text>

    <!-- Divider -->
    <rect x="488" y="388" width="1" height="40" fill="#1d6fe8" opacity="0.3"/>

    <!-- Stat 4 -->
    <text x="506" y="400" font-size="32" font-weight="700" fill="white">120+</text>
    <text x="506" y="422" font-size="11" letter-spacing="2" fill="#64748b">COMMITS</text>
  </g>

  <!-- Tech chips -->
  <g font-family="Courier New, monospace" font-size="12" fill="#60a5fa">
    <!-- React -->
    <rect x="140" y="458" width="68" height="22" rx="3" fill="#1d6fe8" fill-opacity="0.12" stroke="#1d6fe8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="153" y="473" letter-spacing="1">React 19</text>
    <!-- TypeScript -->
    <rect x="216" y="458" width="86" height="22" rx="3" fill="#1d6fe8" fill-opacity="0.12" stroke="#1d6fe8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="226" y="473" letter-spacing="1">TypeScript</text>
    <!-- PostgreSQL -->
    <rect x="310" y="458" width="92" height="22" rx="3" fill="#1d6fe8" fill-opacity="0.12" stroke="#1d6fe8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="320" y="473" letter-spacing="1">PostgreSQL</text>
    <!-- Playwright -->
    <rect x="410" y="458" width="86" height="22" rx="3" fill="#1d6fe8" fill-opacity="0.12" stroke="#1d6fe8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="420" y="473" letter-spacing="1">Playwright</text>
    <!-- Docker -->
    <rect x="504" y="458" width="62" height="22" rx="3" fill="#1d6fe8" fill-opacity="0.12" stroke="#1d6fe8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="516" y="473" letter-spacing="1">Docker</text>
    <!-- Prisma -->
    <rect x="574" y="458" width="62" height="22" rx="3" fill="#1d6fe8" fill-opacity="0.12" stroke="#1d6fe8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="585" y="473" letter-spacing="1">Prisma</text>
  </g>

  <!-- Version badge -->
  <rect x="908" y="440" width="100" height="30" rx="4" fill="#1d6fe8" fill-opacity="0.15" stroke="#1d6fe8" stroke-opacity="0.4" stroke-width="1"/>
  <text x="948" y="460" font-family="Courier New, monospace" font-size="13" fill="#60a5fa" text-anchor="middle" letter-spacing="1">v2.13.0</text>

  <!-- Bottom accent -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#accent)"/>
</svg>
